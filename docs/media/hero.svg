<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="LUMIQ: your sales file, answered in plain words. Every number checked on your phone.">
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif; }
    .tile { transform-box: fill-box; transform-origin: center; animation: tile 7s cubic-bezier(.23,1,.32,1) infinite; }
    .sun { transform-box: fill-box; transform-origin: center; animation: sun 7s cubic-bezier(.23,1,.32,1) infinite; }
    .l { animation: letter 7s cubic-bezier(.23,1,.32,1) infinite; opacity: 0; }
    .l1 { animation-delay: .25s; } .l2 { animation-delay: .32s; } .l3 { animation-delay: .39s; } .l4 { animation-delay: .46s; } .l5 { animation-delay: .53s; }
    .line { animation: rise 7s cubic-bezier(.23,1,.32,1) infinite; opacity: 0; animation-delay: .7s; }
    .card { animation: rise 7s cubic-bezier(.23,1,.32,1) infinite; opacity: 0; animation-delay: 1.1s; }
    .band { transform-box: fill-box; transform-origin: left center; animation: band 7s cubic-bezier(.23,1,.32,1) infinite; }
    .b1 { animation-delay: 1.7s; } .b2 { animation-delay: 2.1s; } .b3 { animation-delay: 2.5s; }
    .tick { transform-box: fill-box; transform-origin: center; animation: tick 7s cubic-bezier(.23,1,.32,1) infinite; animation-delay: 2.9s; opacity: 0; }
    .light { animation: sweep 7s cubic-bezier(.77,0,.175,1) infinite; animation-delay: .9s; }
    @keyframes tile { 0% { transform: scale(.86); opacity: 0; } 8%, 92% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes sun { 0%, 6% { transform: scale(.3); opacity: 0; } 14%, 92% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
    @keyframes letter { 0% { opacity: 0; transform: translateY(10px); } 8%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(14px); } 9%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes band { 0% { transform: scaleX(0); } 7%, 92% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes tick { 0% { opacity: 0; transform: scale(.5); } 6%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    @keyframes sweep { 0% { transform: translateX(-260px); } 18%, 100% { transform: translateX(1460px); } }
    @media (prefers-reduced-motion: reduce) {
      .tile, .sun, .l, .line, .card, .band, .tick { animation: none; opacity: 1; transform: none; }
      .light { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFD033" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFD033" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFD033" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#F1F0EC"/>
    <rect x="-1" y="-1" width="1202" height="442" rx="28" fill="none" stroke="#D6D3CB" stroke-width="2"/>

    <!-- the mark: the blue tile, the white L, the sun -->
    <g transform="translate(96 74)">
      <g class="tile">
        <rect width="112" height="112" rx="25.2" fill="#2440C0"/>
        <path transform="translate(3.5 -3.5) scale(2.3333)" fill="#FFFFFF" d="M10 8H15A2 2 0 0 1 17 10V19A12 12 0 0 0 29 31H38A2 2 0 0 1 40 33V38A2 2 0 0 1 38 40H13A5 5 0 0 1 8 35V10A2 2 0 0 1 10 8Z"/>
      </g>
      <g transform="translate(3.5 -3.5) scale(2.3333)">
        <circle class="sun" cx="29" cy="19" r="8" fill="#FFD033"/>
      </g>
    </g>

    <!-- the wordmark, letter by letter -->
    <g transform="translate(236 101) scale(1.55)" fill="#1F1C17">
      <path class="l l1" d="M0 5.5A1.5 1.5 0 0 1 1.5 4L5.5 4A1.5 1.5 0 0 1 7 5.5L7 29L16.5 29A1.5 1.5 0 0 1 18 30.5L18 34.5A1.5 1.5 0 0 1 16.5 36L4 36A4 4 0 0 1 0 32Z"/>
      <path class="l l2" d="M23.5 4H27.5A1.5 1.5 0 0 1 29 5.5V23.5A6.5 6.5 0 0 0 42 23.5V5.5A1.5 1.5 0 0 1 43.5 4H47.5A1.5 1.5 0 0 1 49 5.5V23.5A13.5 13.5 0 0 1 22 23.5V5.5A1.5 1.5 0 0 1 23.5 4Z"/>
      <path class="l l3" d="M56.5 5.5A1.5 1.5 0 0 1 58 4L64.27 4A1 1 0 0 1 65.17 4.57L73.96 22.87A.6 .6 0 0 0 75.04 22.87L83.83 4.57A1 1 0 0 1 84.73 4L91 4A1.5 1.5 0 0 1 92.5 5.5L92.5 34.5A1.5 1.5 0 0 1 91 36L87 36A1.5 1.5 0 0 1 85.5 34.5L85.5 15.87L76.06 35.55A.8 .8 0 0 1 75.34 36L73.66 36A.8 .8 0 0 1 72.94 35.55L63.5 15.87L63.5 34.5A1.5 1.5 0 0 1 62 36L58 36A1.5 1.5 0 0 1 56.5 34.5Z"/>
      <path class="l l4" d="M100 5.5A1.5 1.5 0 0 1 101.5 4L105.5 4A1.5 1.5 0 0 1 107 5.5L107 34.5A1.5 1.5 0 0 1 105.5 36L101.5 36A1.5 1.5 0 0 1 100 34.5Z"/>
      <path class="l l5" d="M139.79 34.24A17 17 0 1 1 144.74 29.29L148.96 33.51A3.5 3.5 0 0 1 148.96 38.46A3.5 3.5 0 0 1 144.01 38.46ZM139.6 24.15A10 10 0 1 0 134.65 29.1L133.33 27.78A1.5 1.5 0 0 1 133.33 25.66L136.16 22.83A1.5 1.5 0 0 1 138.28 22.83Z"/>
    </g>

    <!-- the promise -->
    <g class="line">
      <text class="t" x="96" y="262" font-size="50" font-weight="700" fill="#1F1C17" letter-spacing="-1">Your sales file, answered in plain words.</text>
      <text class="t" x="98" y="306" font-size="23" fill="#4E4A42">Open a CSV or Excel file on your Android phone and ask it anything.</text>
    </g>

    <!-- an answer, its numbers checked one by one (the app's own words on its sample file) -->
    <g transform="translate(96 336)"><g class="card">
      <rect width="1008" height="64" rx="18" fill="#FBFAF7" stroke="#D6D3CB" stroke-width="1.5"/>
      <text class="t" x="24" y="40" font-size="21" fill="#1F1C17">Atta =</text>
      <rect class="band b1" x="88" y="16" width="78" height="32" rx="6" fill="#FFD033"/>
      <text class="t" x="94" y="40" font-size="21" font-weight="700" fill="#1F1C17">17,385</text>
      <text class="t" x="186" y="40" font-size="21" fill="#1F1C17">Toor dal =</text>
      <rect class="band b2" x="290" y="16" width="64" height="32" rx="6" fill="#FFD033"/>
      <text class="t" x="296" y="40" font-size="21" font-weight="700" fill="#1F1C17">9,240</text>
      <text class="t" x="374" y="40" font-size="21" fill="#1F1C17">Basmati rice =</text>
      <rect class="band b3" x="518" y="16" width="64" height="32" rx="6" fill="#FFD033"/>
      <text class="t" x="524" y="40" font-size="21" font-weight="700" fill="#1F1C17">7,685</text>
      <g transform="translate(694 18)"><g class="tick">
        <circle cx="14" cy="14" r="14" fill="#FFD033" stroke="#9A7200" stroke-width="2"/>
        <path d="M8 14.5l4 4 8-9" fill="none" stroke="#1F1C17" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g></g>
      <text class="t tick" x="734" y="40" font-size="19" font-weight="600" fill="#1F1C17">Every number checked on your phone</text>
    </g></g>

    <!-- the light crossing once, like the app's opening -->
    <rect class="light" x="0" y="0" width="220" height="440" fill="url(#beam)" opacity=".7"/>
  </g>
</svg>
